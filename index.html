<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>우지 공급망 일보</title>
<!-- 용기 · 캡 금형 SCM 5단계 — 업체 웹 입력 (2026-11-07, JMRP 85_vendor_web.sql · Edge Function vendor-web). 비밀 없음: 로그인 · 규칙은 모두 서버 -->
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #1f2933; --muted: #66727f; --line: #d9dee4;
    --brand: #1d5fa8; --brand-ink: #ffffff; --ok: #1b7f4b; --warn: #b36b00; --bad: #c62828; --wait: #6b5bd2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --card: #1e242b; --ink: #e6eaee; --muted: #9aa5b1; --line: #33404c;
            --brand: #5b9be0; --brand-ink: #0b1724; --ok: #4fc387; --warn: #f0a64a; --bad: #ff6b6b; --wait: #a99cff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  header { background: var(--brand); color: var(--brand-ink); padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header small { display: block; font-weight: normal; opacity: .85; font-size: 13px; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 80px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  input:focus, select:focus { outline: 2px solid var(--brand); border-color: transparent; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 12px 16px; cursor: pointer; }
  .primary { background: var(--brand); color: var(--brand-ink); width: 100%; font-weight: bold; margin-top: 16px; }
  .ghost { background: transparent; color: inherit; border: 1px solid currentColor; padding: 6px 10px; font-size: 14px; }
  .tabs { display: flex; gap: 4px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 2; }
  .tabs button { flex: 1; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .tabs button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: bold; }
  .kinds { display: flex; flex-wrap: wrap; gap: 8px; }
  .kinds button { flex: 1 1 40%; background: var(--card); border: 1px solid var(--line); color: var(--ink); }
  .kinds button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: bold; }
  .row2 { display: flex; gap: 8px; } .row2 > div { flex: 1; }
  .msg { padding: 12px; border-radius: 8px; margin: 12px 0; display: none; }
  .msg.show { display: block; } .msg.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .msg.err { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .msg.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .item { border-top: 1px solid var(--line); padding: 10px 0; }
  .item:first-child { border-top: 0; }
  .item .top { display: flex; justify-content: space-between; gap: 8px; }
  .badge { font-size: 13px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .b-P { background: color-mix(in srgb, var(--wait) 18%, transparent); color: var(--wait); }
  .b-A { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .b-X { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .muted { color: var(--muted); font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  .neg { color: var(--bad); font-weight: bold; }
  .hidden { display: none !important; }
  .foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <h1 id="title">우지 공급망 일보<small id="who"></small></h1>
  <button class="ghost hidden" id="btnPw" type="button">비밀번호</button>
  <button class="ghost hidden" id="btnOut" type="button">로그아웃</button>
</header>
<main>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <!-- 로그인 -->
  <section id="vLogin" class="card hidden">
    <h2 style="margin-top:0">로그인</h2>
    <p class="muted">우지케미칼에서 받은 ID · 비밀번호를 넣으세요.</p>
    <form id="fLogin" autocomplete="on">
      <label for="lid">ID</label>
      <input id="lid" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="lpw">비밀번호</label>
      <input id="lpw" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">로그인</button>
    </form>
  </section>

  <!-- 비밀번호 바꾸기 -->
  <section id="vPw" class="card hidden">
    <h2 style="margin-top:0">비밀번호 바꾸기</h2>
    <p class="muted" id="pwWhy">처음 비밀번호를 내 비밀번호로 바꾸세요 (6자 이상, ID 와 다르게).</p>
    <form id="fPw">
      <label for="pOld">지금 비밀번호</label>
      <input id="pOld" type="password" autocomplete="current-password" required>
      <label for="pNew">새 비밀번호</label>
      <input id="pNew" type="password" autocomplete="new-password" minlength="6" required>
      <label for="pNew2">새 비밀번호 한 번 더</label>
      <input id="pNew2" type="password" autocomplete="new-password" minlength="6" required>
      <button class="primary" type="submit">바꾸기</button>
      <button class="ghost hidden" id="pwCancel" type="button" style="width:100%;margin-top:8px">그만두기</button>
    </form>
  </section>

  <!-- 일 화면 -->
  <section id="vMain" class="hidden">
    <div class="tabs" role="tablist">
      <button type="button" data-tab="tAdd" class="on">일보 넣기</button>
      <button type="button" data-tab="tFlows">내 기록</button>
      <button type="button" data-tab="tBal">남은 양</button>
    </div>

    <div id="tAdd">
      <form id="fAdd" class="card">
        <label for="aDt">날짜</label>
        <input id="aDt" type="date" required>
        <label for="aMold">금형</label>
        <select id="aMold" required></select>
        <label>일보</label>
        <div class="kinds" id="aKinds"></div>
        <div id="aFields"></div>
        <label for="aNote">비고 (없으면 비움)</label>
        <input id="aNote" maxlength="255">
        <button class="primary" type="submit" id="aBtn">넣기</button>
        <p class="muted" style="margin-bottom:0">넣은 일보는 <b>우지케미칼이 확인한 뒤</b> 반영됩니다. 틀렸으면 '내 기록' 에서 [취소] 하고 다시 넣으세요.</p>
      </form>
      <div class="card"><b>오늘 넣은 것</b><div id="today" class="muted">없음</div></div>
    </div>

    <div id="tFlows" class="hidden">
      <div class="card">
        <div class="row2">
          <div><label for="fFrom">부터</label><input id="fFrom" type="date"></div>
          <div><label for="fTo">까지</label><input id="fTo" type="date"></div>
        </div>
        <button class="primary" type="button" id="fShow">보기</button>
      </div>
      <div class="card" id="flowList"></div>
    </div>

    <div id="tBal" class="hidden">
      <div class="card">
        <label for="bMon">달</label>
        <input id="bMon" type="month">
        <button class="primary" type="button" id="bShow">보기</button>
        <p class="muted" style="margin-bottom:0">우지케미칼이 <b>반영한</b> 일보만 셉니다. 기말이 마이너스 (빨강) 이면 빠진 일보가 있는지 봐 주세요.</p>
      </div>
      <div id="balList"></div>
    </div>
  </section>
  <p class="foot">우지케미칼 JMRP · 문의는 우지케미칼 구매 담당</p>
</main>

<script>
"use strict";
// 운영 주소. 시험 (개발 DB) 사본은 이 한 줄만 바꿔서 씀 (공개 페이지에 개발 주소 없음)
const API = "https://amietbxergoqrdlwhsji.supabase.co/functions/v1/vendor-web";
const KEY = "jmrp_vweb_token";
const KIND = { INJ: "사출", MOVE: "이동 (→ 인쇄업체)", PRT: "인쇄", DLV: "당사로 납품" };
const FIELDS = {
  INJ:  [["qty_good", "양품 수량 (개)", true], ["qty_bad", "불량 수량 (개)"]],
  MOVE: [["qty_good", "보낸 수량 (개)", true], ["to_party", "받는 인쇄업체", true, "select"]],
  PRT:  [["qty_good", "인쇄 양품 (개)", true], ["qty_bad", "인쇄 불량 (개)"], ["qty_bad2", "사출 불량 — 받고 보니 (개)"]],
  DLV:  [["qty_good", "납품 수량 (개)", true], ["ref_no", "납품서 번호 (있으면)"]],
};
let me = null, kind = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => (v === null || v === undefined || v === "") ? "" : Number(v).toLocaleString("ko-KR");
const ymd = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function store(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) { /* 저장 못 해도 이 창에서는 됨 */ } }
function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
let token = stored();

function say(text, cls) {
  const m = $("msg");
  m.textContent = text || "";
  m.className = "msg" + (text ? " show " + (cls || "ok") : "");
  if (text) window.scrollTo({ top: 0, behavior: "smooth" });
}

async function call(action, body) {
  let r;
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 20000);
  try {
    r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", ...(token ? { "x-vweb-token": token } : {}) },
                           body: JSON.stringify({ action, ...(body || {}) }), signal: ac.signal });
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "응답이 늦습니다 — 잠시 뒤 다시 하세요." : "인터넷 연결을 확인하세요.");
  } finally {
    clearTimeout(timer);
  }
  let j = {};
  try { j = await r.json(); } catch (e) { /* 빈 응답 */ }
  if (r.status === 401) { token = null; store(null); show("vLogin"); throw new Error(j.msg || "다시 로그인하세요."); }
  if (!r.ok) throw new Error(j.msg || "잠시 뒤 다시 하세요.");
  return j;
}

function show(view) {
  for (const v of ["vLogin", "vPw", "vMain"]) $(v).classList.toggle("hidden", v !== view);
  const inn = view !== "vLogin";
  $("btnOut").classList.toggle("hidden", !inn);
  $("btnPw").classList.toggle("hidden", view !== "vMain");
  if (!inn) $("who").textContent = "";
}

async function start() {
  if (!token) { show("vLogin"); return; }
  try {
    me = await call("me");
  } catch (e) {
    say(e.message, "err");
    return;
  }
  $("who").textContent = (me.vendor_name || me.vendor) + " · " + me.name;
  if (me.must_change) { pwView(true); return; }
  mainView();
}

function pwView(first) {
  show("vPw");
  $("pwWhy").textContent = first ? "처음 비밀번호를 내 비밀번호로 바꾸세요 (6자 이상, ID 와 다르게)." : "새 비밀번호 (6자 이상, ID 와 다르게).";
  $("pwCancel").classList.toggle("hidden", first);
  $("fPw").reset();
}

function mainView() {
  show("vMain");
  const t = new Date(me.today + "T00:00:00");
  const min = new Date(t); min.setDate(min.getDate() - (me.back_days || 7));
  $("aDt").value = me.today; $("aDt").max = me.today; $("aDt").min = ymd(min);
  const sel = $("aMold"), keep = sel.value;
  sel.innerHTML = me.molds.length ? "" : '<option value="">(넣을 금형이 없습니다 — 우지케미칼에 문의)</option>';
  for (const m of me.molds) {
    const o = document.createElement("option");
    o.value = m.mold_no;
    o.textContent = (m.vendor_mold_no ? m.vendor_mold_no + " · " : "") + m.mold_name + " (" + ({ BODY: "용기", CAP: "캡" }[m.part_kind] || "기타") + ")";
    sel.appendChild(o);
  }
  if (keep && me.molds.some((m) => m.mold_no === keep)) sel.value = keep;
  moldChanged();
  const now = new Date(me.today + "T00:00:00");
  $("fFrom").value = ymd(new Date(now.getFullYear(), now.getMonth(), 1)); $("fTo").value = me.today;
  $("bMon").value = me.today.slice(0, 7);
  loadToday();
}

function curMold() { return me.molds.find((m) => m.mold_no === $("aMold").value); }

function moldChanged() {
  const m = curMold(), box = $("aKinds");
  box.innerHTML = "";
  if (!m) { $("aFields").innerHTML = ""; return; }
  if (!m.kinds.includes(kind)) kind = m.kinds[0];
  for (const k of m.kinds) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = KIND[k]; b.className = k === kind ? "on" : "";
    b.onclick = () => { kind = k; moldChanged(); };
    box.appendChild(b);
  }
  const f = $("aFields");
  f.innerHTML = "";
  for (const [key, text, need, type] of FIELDS[kind]) {
    const l = document.createElement("label");
    l.textContent = text;
    l.htmlFor = "q_" + key;
    f.appendChild(l);
    let i;
    if (type === "select") {
      i = document.createElement("select");
      for (const p of m.print_vendors) { const o = document.createElement("option"); o.value = p.vendor; o.textContent = p.name || p.vendor; i.appendChild(o); }
    } else {
      i = document.createElement("input");
      if (key.startsWith("qty")) { i.inputMode = "numeric"; i.pattern = "[0-9,]*"; i.autocomplete = "off"; } else { i.maxLength = 40; }
    }
    i.id = "q_" + key; i.required = !!need;
    f.appendChild(i);
  }
}

async function loadToday() {
  try {
    const rows = await call("flows", { from: me.today, to: me.today });
    const mine = rows.filter((r) => r.mine);
    $("today").innerHTML = mine.length ? mine.map(itemHtml).join("") : "없음";
    bindCancel($("today"));
  } catch (e) { $("today").textContent = e.message; }
}

function qtyText(r) {
  const parts = [r.kind === "MOVE" ? "보냄 " + num(r.qty_good) : (r.kind === "DLV" ? "납품 " : "양품 ") + num(r.qty_good)];
  if (Number(r.qty_bad)) parts.push((r.kind === "PRT" ? "인쇄 불량 " : "불량 ") + num(r.qty_bad));
  if (Number(r.qty_bad2)) parts.push("사출 불량 " + num(r.qty_bad2));
  return parts.join(" · ");
}

function itemHtml(r) {
  const who = r.kind === "MOVE" ? (r.to_party_name || r.to_party) + " 로" : "";
  return '<div class="item"><div class="top"><b>' + esc(r.flow_dt) + " · " + esc(r.kind_name) + "</b>"
    + '<span class="badge b-' + esc(r.status) + '">' + esc(r.status_name) + "</span></div>"
    + "<div>" + esc((r.vendor_mold_no ? r.vendor_mold_no + " · " : "") + r.mold_name) + "</div>"
    + "<div>" + esc(qtyText(r)) + (who ? " · " + esc(who) : "") + (r.kind === "MOVE" && !r.mine && r.party_name ? " (" + esc(r.party_name) + " 에서)" : "") + "</div>"
    + '<div class="muted">' + esc(r.source_name) + (r.ref_no ? " · 납품서 " + esc(r.ref_no) : "") + (r.note ? " · " + esc(r.note) : "")
    + (r.reason && r.status === "X" ? " · 사유: " + esc(r.reason) : "") + "</div>"
    + (r.can_cancel ? '<button class="ghost" type="button" data-cancel="' + Number(r.id) + '" style="margin-top:6px">취소</button>' : "")
    + "</div>";
}

function bindCancel(root) {
  root.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = async () => {
    if (!confirm("이 일보를 취소할까요?")) return;
    try { await call("cancel", { id: Number(b.dataset.cancel) }); say("취소했습니다.", "ok"); loadToday(); if (!$("tFlows").classList.contains("hidden")) loadFlows(); }
    catch (e) { say(e.message, "err"); }
  });
}

async function loadFlows() {
  const box = $("flowList");
  box.textContent = "읽는 중…";
  try {
    const rows = await call("flows", { from: $("fFrom").value, to: $("fTo").value });
    box.innerHTML = rows.length ? rows.map(itemHtml).join("") : '<span class="muted">기록이 없습니다.</span>';
    bindCancel(box);
  } catch (e) { box.textContent = e.message; }
}

async function loadBal() {
  const box = $("balList"), mon = $("bMon").value;
  if (!/^\d{4}-\d{2}$/.test(mon)) return;
  box.innerHTML = '<div class="card">읽는 중…</div>';
  const [y, mm] = mon.split("-").map(Number);
  const last = new Date(y, mm, 0);
  const to = ymd(last) > me.today ? me.today : ymd(last);
  try {
    const r = await call("balance", { from: mon + "-01", to });
    const by = {};
    for (const x of r.rows) (by[x.mold_no] = by[x.mold_no] || { name: (x.vendor_mold_no ? x.vendor_mold_no + " · " : "") + x.mold_name, rows: [] }).rows.push(x);
    let h = r.pending ? '<div class="msg warn show">확인 대기 ' + Number(r.pending) + "건은 아직 안 셉니다.</div>" : "";
    for (const k of Object.keys(by)) {
      h += '<div class="card"><b>' + esc(by[k].name) + "</b><table><tr><th>자리</th><th>기초</th><th>들어옴</th><th>나감</th><th>불량</th><th>기말</th></tr>";
      for (const x of by[k].rows) {
        h += "<tr><td>" + esc(x.pool_name.replace("사출업체 ", "").replace("인쇄업체 ", "")) + "</td><td>" + num(x.opening) + "</td><td>" + num(x.qty_in)
          + "</td><td>" + num(x.qty_out) + "</td><td>" + num(x.qty_bad) + "</td><td" + (Number(x.closing) < 0 ? ' class="neg"' : "") + ">"
          + num(x.closing) + "</td></tr>";
      }
      h += "</table>" + (by[k].rows.some((x) => Number(x.qty_adj)) ? '<p class="muted">조정 (우지케미칼) 포함</p>' : "") + "</div>";
    }
    box.innerHTML = h || '<div class="card muted">이 달 반영된 일보가 없습니다.</div>';
  } catch (e) { box.innerHTML = '<div class="card">' + esc(e.message) + "</div>"; }
}

$("fLogin").onsubmit = async (ev) => {
  ev.preventDefault();
  say("");
  try {
    const r = await call("login", { login_id: $("lid").value.trim(), password: $("lpw").value });
    if (!r.ok) { say(r.msg, "err"); return; }
    token = r.token; store(token);
    $("lpw").value = "";
    if (r.must_change) $("pOld").value = "";
    await start();
  } catch (e) { say(e.message, "err"); }
};

$("fPw").onsubmit = async (ev) => {
  ev.preventDefault();
  if ($("pNew").value !== $("pNew2").value) { say("새 비밀번호 두 칸이 다릅니다.", "err"); return; }
  try {
    await call("pw", { old: $("pOld").value, new: $("pNew").value });
    say("비밀번호를 바꿨습니다.", "ok");
    await start();
  } catch (e) { say(e.message, "err"); }
};
$("pwCancel").onclick = () => mainView();
$("btnPw").onclick = () => pwView(false);
$("btnOut").onclick = async () => {
  try { await call("logout"); } catch (e) { /* 이미 끝났으면 그대로 */ }
  token = null; store(null); me = null; say("로그아웃했습니다.", "ok"); show("vLogin");
};
$("aMold").onchange = moldChanged;
$("fAdd").onsubmit = async (ev) => {
  ev.preventDefault();
  const m = curMold();
  if (!m || !kind) { say("금형 · 일보를 고르세요.", "err"); return; }
  const flow = { flow_dt: $("aDt").value, mold_no: m.mold_no, kind, note: $("aNote").value.trim() || null };
  for (const [key] of FIELDS[kind]) { const el = $("q_" + key); flow[key] = el ? el.value.replace(/,/g, "").trim() : null; }
  $("aBtn").disabled = true;
  try {
    const r = await call("add", { flow });
    say("넣었습니다 (번호 " + r.id + ") — 우지케미칼이 확인하면 반영됩니다." + (r.dup ? " 같은 날 같은 일보가 이미 있습니다 (두 번 넣었으면 하나를 취소하세요)." : ""), r.dup ? "warn" : "ok");
    for (const [key, , , type] of FIELDS[kind]) { if (type !== "select") $("q_" + key).value = ""; }
    $("aNote").value = "";
    loadToday();
  } catch (e) { say(e.message, "err"); }
  finally { $("aBtn").disabled = false; }
};
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  for (const t of ["tAdd", "tFlows", "tBal"]) $(t).classList.toggle("hidden", t !== b.dataset.tab);
  say("");
  if (b.dataset.tab === "tFlows") loadFlows();
  if (b.dataset.tab === "tBal") loadBal();
});
$("fShow").onclick = loadFlows;
$("bShow").onclick = loadBal;
start();
</script>
</body>
</html>
